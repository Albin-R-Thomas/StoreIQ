[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "store-iq"
version = "0.1.0"
description = "Store IQ TV associate workspace with text and reviewed voice input"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "azure-cognitiveservices-speech>=1.53,<2",
    "imageio-ffmpeg>=0.6,<1",
    "openai>=2,<3",
    "reportlab[shaping]>=4.4,<5",
    "tzdata>=2025.1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
