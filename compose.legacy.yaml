services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_iq}
      POSTGRES_USER: ${POSTGRES_USER:-store_iq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_iq_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-store_iq}:${POSTGRES_PASSWORD:-store_iq_dev}@db:5432/${POSTGRES_DB:-store_iq}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-store_iq}:${POSTGRES_PASSWORD:-store_iq_dev}@db:5432/${POSTGRES_DB:-store_iq}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
